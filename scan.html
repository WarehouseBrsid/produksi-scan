/* Barang penyesuaian PO (dibuat Admin Produksi; menggantikan defect / salah cutting / kurang): ikut dikirim bersama MKL. */
function gantiHtml_(it) {
  if (!it.ganti || !it.ganti.length) return '';
  return '<div class="pv" style="border:1px dashed var(--pri);border-radius:10px;padding:6px 8px;margin:6px 0"><b style="color:var(--pri)">Barang penyesuaian</b> <span class="mut">(ikut dikirim)</span><br>' +
    it.ganti.map(function (g) { return '<b>' + g.qty + '</b> ' + esc(g.nama) + ' <span class="mut">(ganti ' + esc(String(g.alasan).toLowerCase()) + ')</span>'; }).join('<br>') + '</div>';
}
/* SALAH CUTTING (PO): pilih baris + ketik nama barang yang terpotong salah (bebas, tanpa dropdown) + jumlah.
 * Barang ini tetap dijahit (output dihitung) dan jadi stok gudang; barang yang benar dibuatkan penyesuaian oleh Admin Produksi. */
function salahHtml_(i) {
  var c = CART[i], opt = c.d.items.map(function (it, k) { return '<option value="' + k + '">' + esc(it.label || it.kc) + ' · ' + esc(it.nama) + '</option>'; }).join('');
  return '<div class="kcbox"><div><b>Salah cutting</b> <span class="mut">(barang terpotong salah; tetap dijahit, masuk stok gudang)</span></div>' +
    c.salah.map(function (l, k) { return '<div class="pv"><b>' + l.qty + '</b> ' + esc(l.nama) + ' <span class="mut">(di ' + esc(l.label) + ')</span> <button class="x" style="margin-left:6px" onclick="CART[' + i + '].salah.splice(' + k + ',1);proses_()">×</button></div>'; }).join('') +
    '<select id="sb' + i + '" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-top:6px">' + opt + '</select>' +
    '<div class="prt"><input id="sn' + i + '" style="flex:1;min-width:0;text-align:left;font-size:14px" autocapitalize="characters" placeholder="Nama barang salah, mis. SPREI-160-30_HB_BEAR"><input type="number" inputmode="numeric" min="1" id="sq' + i + '" placeholder="pcs"></div>' +
    '<button class="btn" style="width:100%;margin-top:6px" onclick="addSalah_(' + i + ')">+ Tambah salah cutting</button></div>';
}
function addSalah_(i) {
  var c = CART[i], it = c.d.items[+$('sb' + i).value], nm = String($('sn' + i).value || '').trim().toUpperCase().replace(/\s+/g, '_'), q = Math.floor(Number($('sq' + i).value));
  if (!it || !nm || !(q > 0)) { toast('Pilih baris, tulis nama barang yang salah, dan isi jumlah'); return; }
  var ada = c.salah.filter(function (l) { return l.kc === it.kc && l.nama === nm; })[0];
  if (ada) ada.qty += q; else c.salah.push({ kc: it.kc, label: it.label || it.kc, nama: nm, qty: q });
  proses_();
}
/* Barang LEBIH dari cutting (aturan semua penjahit): pilih baris + nama barang (barang itu / komponennya) + jumlah. */
function lebihHtml_(i) {
  var c = CART[i], its = c.d.items.filter(function (it) { return it.lebihOpsi && it.lebihOpsi.length; });
  if (!its.length) return '';
  var opt = its.map(function (it, k) { return it.lebihOpsi.map(function (n) { return '<option value="' + k + '|' + esc(n) + '">' + esc(it.label || it.kc) + ' · ' + esc(n) + '</option>'; }).join(''); }).join('');
  return '<div class="kcbox"><div><b>Barang lebih</b> <span class="mut">(hasil cutting lebih dari pesanan; ikut dikirim ke gudang)</span></div>' +
    c.lebih.map(function (l, k) { return '<div class="pv"><b>' + l.qty + '</b> ' + esc(l.nama) + ' <span class="mut">(' + esc(l.label) + ')</span> <button class="x" style="margin-left:6px" onclick="CART[' + i + '].lebih.splice(' + k + ',1);proses_()">×</button></div>'; }).join('') +
    '<div class="prt"><select id="lb' + i + '" style="flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)">' + opt + '</select><input type="number" inputmode="numeric" min="1" id="lq' + i + '" placeholder="pcs"></div>' +
    '<button class="btn" style="width:100%;margin-top:6px" onclick="addLebih_(' + i + ')">+ Tambah barang lebih</button></div>';
}
function addLebih_(i) {
  var c = CART[i], v = String($('lb' + i).value).split('|'), q = Math.floor(Number($('lq' + i).value)), its = c.d.items.filter(function (it) { return it.lebihOpsi && it.lebihOpsi.length; }), it = its[+v[0]];
  if (!it || !(q > 0)) { toast('Pilih barang dan isi jumlah lebih'); return; }
  var ada = c.lebih.filter(function (l) { return l.kc === it.kc && l.nama === v[1]; })[0];
  if (ada) ada.qty += q; else c.lebih.push({ kc: it.kc, label: it.label || it.kc, nama: v[1], qty: q });
  proses_();
}
function setCacat_(el) {
  var c = CART[+el.dataset.i], it = c.d.items.filter(function (x) { return x.kc === el.dataset.kc; })[0], v = Math.floor(Number(el.value));
  c.cacat[it.kc] = isFinite(v) && v > 0 ? v : 0;
  $('pv' + el.dataset.i + '_' + it.kc).innerHTML = prevHtml_(it, c.cnt[it.kc], true, c.cacat[it.kc]);
}
function setFinal_(i, f) { CART[i].final = f; CART[i].d.items.forEach(function (it) { var el = $('pv' + i + '_' + it.kc); if (el) el.innerHTML = prevHtml_(it, CART[i].cnt[it.kc], f); }); }
function setCnt_(el) {
  var c = CART[+el.dataset.i], it = c.d.items.filter(function (x) { return x.kc === el.dataset.kc; })[0], p = it.parts.filter(function (x) { return x.key === el.dataset.k; })[0];
  var v = Math.floor(Number(el.value)); if (!isFinite(v) || v < 0) v = 0; if (v > p.max) { v = p.max; el.value = v; }
  c.cnt[it.kc][p.key] = el.value === '' ? 0 : v;
  $('pv' + el.dataset.i + '_' + it.kc).innerHTML = prevHtml_(it, c.cnt[it.kc], c.final || !c.d.bolehSebagian, c.cacat && c.cacat[it.kc]);
}
function penuh_(i) { var c = CART[i]; c.d.items.forEach(function (it) { it.parts.forEach(function (p) { c.cnt[it.kc][p.key] = p.max; }); }); proses_(); }
function hasilSheet_(judul, rows) {

  CART = CART.filter(function (c) { return ok.indexOf(c.d.ids) < 0; }); drawCart();

    return '<div class="kcbox">' + (r.ok ? '<b style="color:var(--ok)">✓ ' : '<b style="color:var(--bad)">✗ ') + esc(r.ids) + '</b>' + (r.ok ? (r.ke || r.kelengkapan ? (r.ke ? ' · kiriman ' + r.ke + ' · lembar ' + esc(r.lembar) : '') + ' · ' + r.total + ' pcs' + (r.kirimSendiri ? ' · diantar sendiri' : r.ulang ? '' : ' · menunggu dijemput') + (r.ulang ? ' (sudah tercatat)' : '') : (r.ulang ? ' sudah diterima' : ' diterima')) : '<div>' + esc(r.error) + '</div>') +
      (r.hasil ? '<div class="pv">' + r.hasil.map(function (x) { return '<b>' + x.qty + '</b> ' + esc(x.nama); }).join(' + ') + '</div>' : '') +
      (r.kurang && r.kurang.length ? '<div class="pv"><span class="k">Kurang: ' + r.kurang.map(function (x) { return x.qty + ' ' + esc(x.nama); }).join(', ') + '</span></div>' : '') +
      (r.cacat && r.cacat.length ? '<div class="pv"><span class="k">Cacat: ' + r.cacat.map(function (x) { return x.qty + ' ' + esc(x.nama); }).join(', ') + '</span></div>' : '') +
      (r.salah && r.salah.length ? '<div class="pv">Salah cutting: ' + r.salah.map(function (x) { return '<b>' + x.qty + '</b> ' + esc(x.nama); }).join(', ') + '</div>' : '') +
      (r.lebih && r.lebih.length ? '<div class="pv">Barang lebih: ' + r.lebih.map(function (x) { return '<b>' + x.qty + '</b> ' + esc(x.nama); }).join(', ') + '</div>' : '') +
      (r.kelengkapan ? '<div class="pv">Kelengkapan: <b>' + esc(r.kelengkapan) + '</b></div>' : '') +
      (r.tanpaSku && r.tanpaSku.length ? '<div class="pv">Belum ada di Data Base Gudang: ' + r.tanpaSku.map(esc).join(', ') + '</div>' : '') + '</div>';
  }).join('') + '<button class="btn pri" style="width:100%;margin-top:10px" onclick="tutup()">' + (CART.length ? 'Kembali ke keranjang' : 'Scan berikutnya') + '</button></div>';
  $('ov').className = 'on';

function kirimTerima_() {
  var T = CART.filter(function (c) { return c.d.aksi === 'TERIMA'; }), ids = T.filter(function (c) { return !c.d.po; }).map(function (c) { return c.d.ids; }), mk = T.filter(function (c) { return c.d.po; }).map(function (c) { return c.d.ids; }); $('goT').disabled = true;
  (ids.length ? api('jterima', { token: ST.token, ids: ids }) : Promise.resolve({ hasil: [] })).then(function (r1) { return (mk.length ? api('mterima', { token: ST.token, mkl: mk }) : Promise.resolve({ hasil: [] })).then(function (r2) { hasilSheet_('Terima barang', r1.hasil.concat(r2.hasil)); }); })
    .catch(function (e) { tampil(false, e.message, /Token|Sesi|masuk lagi/i.test(e.message)); });
}
function kirimSelesai_() {
  var S = CART.filter(function (c) { return c.d.aksi === 'SELESAI'; }), lb = function (c) { return c.lebih.map(function (l) { return { kc: l.kc, nama: l.nama, qty: l.qty }; }); };
  var L = S.filter(function (c) { return !c.d.po; }).map(function (c) { return { ids: c.d.ids, ref: c.ref, final: c.d.bolehSebagian ? c.final : true, kirimSendiri: !!c.sendiri, hasil: c.cnt, lebih: lb(c) }; });
  var M = S.filter(function (c) { return c.d.po; }).map(function (c) { return { mkl: c.d.ids, ref: c.ref, kirimSendiri: !!c.sendiri, hasil: c.cnt, cacat: c.cacat, lebih: lb(c), salah: (c.salah || []).map(function (l) { return { kc: l.kc, nama: l.nama, qty: l.qty }; }) }; });
  $('goS').disabled = true;
  var a = L.length ? api('jselesai', { token: ST.token, list: L }) : Promise.resolve({ hasil: [] });
  a.then(function (r1) { return (M.length ? api('mselesai', { token: ST.token, list: M }) : Promise.resolve({ hasil: [] })).then(function (r2) { hasilSheet_('Hasil jahit terkirim', r1.hasil.concat(r2.hasil)); }); })
    .catch(function (e) { tampil(false, e.message, /Token|Sesi|masuk lagi/i.test(e.message)); });

/* ---------- Mode Driver: daftar job + keranjang ambil/jemput ----------
 * Siap diantar = Surat Jalan sudah dicetak; Siap dijemput = kiriman hasil jahit menunggu. Scan -> dcek -> keranjang -> dproses.
 * Peran DRIVER juga dipakai orang divisi lain yang menggantikan driver (nama tercatat dari akunnya). */
var DCART = [];
function loadJobs_() {
  if (!$('jobs')) return;
  api('djob', { token: ST.token }).then(function (j) {
    if (!$('jobs')) return;
    var sec = function (judul, L, ket, batal) { return '<div class="lbl">' + judul + ' (' + L.length + ')</div>' + (L.length ? L.map(function (x) { return '<div class="it" style="padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--card)"><div style="flex:1;min-width:0"><b>' + esc(x.ids) + '</b>' + (x.ke ? ' <span class="tag s">kiriman ' + x.ke + '</span>' : '') + '<div class="mut">' + esc(x.nama) + ' · ' + esc(x.kode) + ' · ' + x.pcs + ' pcs' + (x.jml && !x.ke ? ' · ' + x.jml + ' KC' : '') + (x.po ? ' · <b>' + esc(x.identitas) + '</b>' : '') + '</div></div>' + (batal ? '<button class="chip" data-ids="' + esc(x.ids) + '" onclick="dbatal_(this.dataset.ids)">Batalkan</button>' : '') + '</div>'; }).join('') : '<div class="mut" style="padding:2px 2px 8px">' + ket + '</div>'); };
    $('jobs').innerHTML = '<div style="display:flex;align-items:center;margin-top:12px"><b style="flex:1">Daftar job</b><button class="chip" onclick="loadJobs_()">Muat ulang</button></div>' +
      sec('Siap diantar ke penjahit', j.antar, 'Tidak ada.') + sec('Siap dijemput dari penjahit', j.jemput, 'Tidak ada.') + sec('Sedang saya antar', j.bawa, 'Tidak ada.', 1) + sec('Sedang saya jemput', j.dijemput, 'Tidak ada.', 1);
  }).catch(function (e) { if ($('jobs')) $('jobs').innerHTML = '<div class="mut">' + esc(e.message) + '</div>'; });
}
function drvAdd(ids) {
  if (DCART.some(function (c) { return c.ids === ids; })) { toast(ids + ' sudah di keranjang'); return; }
  busy = true; if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
  api('dcek', { token: ST.token, ids: ids }).then(function (r) { busy = false; DCART.push(r); drawDCart(); kilat_(ids + ' masuk keranjang'); })
    .catch(function (e) { busy = false; tampil(false, e.message, /Token|Sesi|masuk lagi/i.test(e.message)); });
}
function drawDCart() {
  if (!$('cart')) return;
  var n = DCART.length;
  $('cart').innerHTML = n ? '<div class="lbl">Keranjang (' + n + ')</div>' + DCART.map(function (d, i) {
    return '<div class="it"><div style="flex:1;min-width:0"><div><b>' + esc(d.ids) + '</b> <span class="tag' + (d.aksi === 'JEMPUT' ? ' s' : '') + '">' + (d.aksi === 'AMBIL' ? 'Ambil · antar ke penjahit' : d.po ? 'Jemput · ke gudang' : 'Jemput · kiriman ' + d.kirim.map(function (k) { return k.ke; }).join('+')) + '</span></div><div class="mut">' + esc(d.nama) + ' · ' + d.pcs + ' pcs' + (d.po ? ' · <b>' + esc(d.identitas) + '</b>' : '') + '</div></div><button class="x" aria-label="Hapus" onclick="DCART.splice(' + i + ',1);drawDCart()">×</button></div>';
  }).join('') : '<div class="mut" style="padding:6px 2px">Keranjang kosong. Scan QR di Surat Jalan / PO Penjahit yang kamu bawa.</div>';
  $('cbar').innerHTML = n ? '<button class="btn pri" style="width:100%" onclick="dproses_()">Proses keranjang (' + n + ')</button>' : '';
}
function dproses_() {
  var A = DCART.filter(function (d) { return d.aksi === 'AMBIL'; }), J = DCART.filter(function (d) { return d.aksi === 'JEMPUT'; });
  var blok = function (judul, L, ket) { return L.length ? '<div class="kp">' + judul + ' (' + L.length + ')</div><div class="mut">' + ket + '</div>' + L.map(function (d) { return '<div class="kcbox"><b>' + esc(d.ids) + '</b> · ' + esc(d.nama) + ' · ' + d.pcs + ' pcs</div>'; }).join('') : ''; };
  $('sh').innerHTML = '<div class="sheetx">' + blok('Ambil untuk diantar', A, 'Barang potong + Surat Jalan 3 lembar (Stock) / PO Penjahit + PO Gudang (MKL) dibawa ke penjahit. Penjahit scan terima saat sampai.') +
    blok('Jemput hasil jahit', J, 'Barang jadi + lembar Putih/Kuning (Stock) / PO Gudang (MKL) dibawa ke gudang. Gudang mencatat saat barang diterima.') +
    '<button class="btn pri" style="width:100%;margin-top:8px" id="goD" onclick="kirimDriver_()">Konfirmasi ' + DCART.length + ' dokumen</button><button class="btn" style="width:100%;margin-top:10px" onclick="tutup()">Tutup</button></div>';
  $('ov').className = 'on'; busy = true;

function kirimDriver_() {
  $('goD').disabled = true;
  api('dproses', { token: ST.token, ids: DCART.map(function (d) { return d.ids; }) }).then(function (r) {
    var ok = r.hasil.filter(function (x) { return x.ok; }).map(function (x) { return x.ids; });
    DCART = DCART.filter(function (d) { return ok.indexOf(d.ids) < 0; }); drawDCart(); loadJobs_();
    $('sh').innerHTML = '<div class="sheetx"><div class="kp">Tercatat</div>' + r.hasil.map(function (x) {
      return '<div class="kcbox">' + (x.ok ? '<b style="color:var(--ok)">✓ ' : '<b style="color:var(--bad)">✗ ') + esc(x.ids) + '</b>' + (x.ok ? ' · ' + (x.aksi === 'AMBIL' ? 'sedang diantar' : 'sedang dijemput') + (x.pcs ? ' · ' + x.pcs + ' pcs' : '') + (x.ulang ? ' (sudah tercatat)' : '') : '<div>' + esc(x.error) + '</div>') + '</div>';
    }).join('') + '<button class="btn pri" style="width:100%;margin-top:10px" onclick="tutup()">' + (DCART.length ? 'Kembali ke keranjang' : 'Scan berikutnya') + '</button></div>';
    $('ov').className = 'on';
  }).catch(function (e) { tampil(false, e.message, /Token|Sesi|masuk lagi/i.test(e.message)); });
}

/** Batalkan ambil/jemput yang salah (alasan wajib). Kiriman yang sudah dijemput dikembalikan ke Tinggal Jemput. */
function dbatal_(ids) {
  busy = true;
  $('sh').innerHTML = '<div class="sheetx"><div class="kp">Batalkan ' + esc(ids) + '?</div><div class="mut">Pakai kalau salah scan / salah ambil. Status kembali ke Tinggal Antar / Tinggal Jemput.</div><input class="inp" id="dba" style="margin-top:10px;font-size:16px;text-align:left" maxlength="200" placeholder="Alasan (wajib), mis. salah ambil"><div class="row"><button class="btn" style="flex:1" onclick="tutup()">Kembali</button><button class="btn pri" style="flex:1" id="goB">Batalkan</button></div></div>';
  $('ov').className = 'on';
  $('goB').onclick = function () { $('goB').disabled = true; api('dbatal', { token: ST.token, ids: ids, alasan: $('dba').value }).then(function (r) { tampil(true, r.ket); loadJobs_(); }).catch(function (e) { tampil(false, e.message); }); };
}

/* ---------- Mode Loading (PIC Loading di gudang) ----------
 * Scan QR Surat Jalan atau label barang -> lcek -> daftar kiriman yang menuju gudang & barangnya -> isi Diterima / Reject
 * (awal = jumlah kiriman, reject 0) -> Konfirmasi (lkonfirm, ref unik). Hasil masuk tab "Stock diloading" di Web App Gudang. */
var LD = null, LREC = [];
function rcL_() { if ($('rc')) $('rc').innerHTML = LREC.length ? '<div class="lbl">Diterima sesi ini</div>' + LREC.map(function (r) { return '<div class="card" style="padding:12px"><b>' + esc(r.ids) + '</b> <span class="mut">· ' + esc(r.jam) + '</span><div class="mut">diterima ' + r.terima + (r.reject ? ' · reject ' + r.reject : '') + (r.selisih ? ' · selisih ' + r.selisih : '') + (r.selesai ? ' · IDS selesai' : '') + '</div></div>'; }).join('') : ''; }
function ldgCek(kode) {
  busy = true; if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
  api('lcek', { token: ST.token, kode: kode }).then(function (r) {
    LD = { d: r, ref: newRef_(), pakai: {}, v: {} };
    r.kirim.forEach(function (k) { LD.pakai[k.ke] = true; k.barang.forEach(function (b) { LD.v[k.ke + '|' + b.kc + '|' + b.nama] = { terima: b.qty, reject: 0 }; }); });
    ldgForm_();
  }).catch(function (e) { last.t = Date.now(); tampil(false, e.message, /Token|Sesi|masuk lagi/i.test(e.message)); });
}
function ldgForm_() {
  var d = LD.d;
  $('sh').innerHTML = '<div class="sheetx"><div class="mut" style="letter-spacing:.08em;font-weight:600">TERIMA DI GUDANG</div><div class="kp" style="margin-top:4px">' + esc(d.ids) + '</div><div class="mut">' + esc(d.nama) + ' · ' + esc(d.kode) + '</div>' +
    d.kirim.map(function (k) {
      return '<div class="kcbox"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ' + (LD.pakai[k.ke] ? 'checked' : '') + ' onchange="LD.pakai[' + k.ke + ']=this.checked"><b>Kiriman ' + k.ke + ' · lembar ' + esc(k.lembar) + '</b></label><div class="mut" style="font-size:12px">' + (k.metode === 'ANTAR_SENDIRI' ? 'diantar penjahit' : k.jemputOleh ? 'dijemput ' + esc(k.jemputOleh) : 'belum discan jemput') + ' · ' + k.total + ' pcs</div>' +
        k.barang.map(function (b) {
          var key = k.ke + '|' + b.kc + '|' + b.nama, v = LD.v[key];
          return '<div class="kcbox"><div style="word-break:break-word"><b>' + esc(b.nama) + '</b></div><div class="mut" style="font-size:12px">' + esc(b.sku || 'SKU belum ada di Data Base') + ' · ' + esc(b.kc) + ' · dikirim <b>' + b.qty + '</b>' + (b.lebih ? ' <span class="tag s">termasuk ' + b.lebih + ' barang lebih</span>' : '') + '</div>' +
            '<div class="prt"><label>Diterima baik</label><input type="number" inputmode="numeric" min="0" max="' + b.qty + '" value="' + v.terima + '" data-key="' + esc(key) + '" data-f="terima" oninput="ldgSet_(this,' + b.qty + ')"></div>' +
            '<div class="prt"><label>Reject (ke Defect)</label><input type="number" inputmode="numeric" min="0" max="' + b.qty + '" value="' + v.reject + '" data-key="' + esc(key) + '" data-f="reject" oninput="ldgSet_(this,' + b.qty + ')"></div>' +
            '<div class="pv" id="ls_' + esc(key) + '">' + ldgSel_(b.qty, v) + '</div></div>';
        }).join('') + (k.kurang.length ? '<div class="pv"><span class="k">Kurang dari penjahit: ' + k.kurang.map(function (x) { return x.qty + ' ' + esc(x.nama); }).join(', ') + '</span></div>' : '') + '</div>';
    }).join('') +
    '<input class="inp" id="lcat" style="font-size:15px;text-align:left;margin-top:6px" maxlength="200" placeholder="Catatan (opsional)">' +
    '<div class="row"><button class="btn" style="flex:1" onclick="last.t=Date.now();tutup()">Batal</button><button class="btn pri" style="flex:2" id="goL" onclick="ldgKirim_()">Konfirmasi diterima</button></div></div>';
  $('ov').className = 'on';
}
function ldgSel_(q, v) { var s = q - (Number(v.terima) || 0) - (Number(v.reject) || 0); return s > 0 ? '<span class="k">Selisih ' + s + ' (tidak ada / hilang)</span>' : s < 0 ? '<span class="k">Melebihi jumlah kiriman</span>' : 'Cocok dengan kiriman'; }
function ldgSet_(el, q) { var v = LD.v[el.dataset.key], n = Math.floor(Number(el.value)); if (!isFinite(n) || n < 0) n = 0; if (n > q) { n = q; el.value = n; } v[el.dataset.f] = el.value === '' ? 0 : n; document.getElementById('ls_' + el.dataset.key).innerHTML = ldgSel_(q, v); }
function ldgKirim_() {
  var d = LD.d, kirim = d.kirim.filter(function (k) { return LD.pakai[k.ke]; }).map(function (k) { return { ke: k.ke, barang: k.barang.map(function (b) { var v = LD.v[k.ke + '|' + b.kc + '|' + b.nama]; return { kc: b.kc, nama: b.nama, terima: v.terima, reject: v.reject }; }) }; });
  if (!kirim.length) { toast('Pilih minimal 1 kiriman'); return; }
  $('goL').disabled = true;
  api('lkonfirm', { token: ST.token, data: { ids: d.ids, ref: LD.ref, catatan: $('lcat').value, kirim: kirim } }).then(function (r) {
    last = { kc: d.ids, t: Date.now() + 8000 }; // Surat Jalan masih di depan kamera: jangan langsung terbaca lagi
    if (!r.ulang) LREC.unshift({ ids: d.ids, terima: r.terima, reject: r.reject, selisih: r.selisih, selesai: r.selesai, jam: new Date().toTimeString().slice(0, 5) }); LREC = LREC.slice(0, 8); rcL_();
    tampil(true, d.ids + (r.ulang ? ' sudah tercatat.' : ' diterima: ' + r.terima + ' pcs' + (r.reject ? ', reject ' + r.reject : '') + (r.selisih ? ', selisih ' + r.selisih : '') + '. Lanjut ke tab "Stock diloading" di Web App Gudang.'));
  }).catch(function (e) { tampil(false, e.message); });
}
/* ---------- Mode Terima PO (PIC Gudang PO) ----------
 * Scan QR PO Gudang (MKL) atau label barang PO -> gcek -> lembar kelengkapan: status penyesuaian besar (hijau Sudah dilengkapi /
 * merah Belum dilengkapi / Komplit), per baris barang jadi + ganti + kurang, barang yang masuk stok gudang (lebih / cacat)
 * -> Terima di gudang (gterima, ref unik). Cukup konfirmasi, tanpa input jumlah (keputusan user). */
var GP = null, GREC = [];
function rcG_() { if ($('rc')) $('rc').innerHTML = GREC.length ? '<div class="lbl">Diterima sesi ini</div>' + GREC.map(function (r) { return '<div class="card" style="padding:12px"><b>' + esc(r.mkl) + '</b> <span class="mut">· ' + esc(r.jam) + '</span><div class="mut">' + esc(r.identitas) + ' · ' + r.pcs + ' pcs · <b style="color:' + (r.st === 'BELUM_DILENGKAPI' ? 'var(--bad)' : 'var(--ok)') + '">' + esc(r.label) + '</b></div></div>'; }).join('') : ''; }
var GJ_ = { JADI: '', SISA: 'sisa komponen', CACAT: 'cacat', LEBIH: 'lebih', SALAH: 'salah cutting' };
function gpoCek(kode) {
  busy = true; if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
  api('gcek', { token: ST.token, kode: kode }).then(function (d) { GP = { d: d, ref: newRef_() }; gpoForm_(); })
    .catch(function (e) { last.t = Date.now(); tampil(false, e.message, /Token|Sesi|masuk lagi/i.test(e.message)); });
}
/** Kekurangan yang belum diganti di Produksi: sudah dibuatkan PO urgent / pelengkap (Ref Kurang) atau belum. */
function urgHtml_(u) {
  if (!u || !u.length) return '';
  var semua = u.every(function (x) { return x.po.length && x.qtyUrgent >= x.sisa; });
  return '<div class="pv" style="margin-top:6px"><b style="color:' + (semua ? 'var(--ok)' : 'var(--bad)') + '">' + (semua ? 'Semua kekurangan sudah diurgent' : 'Kekurangan belum diganti') + '</b></div>' + u.map(function (x) {
    var ok = x.po.length > 0;
    return '<div class="pv"><span class="k">' + (x.asal === 'CACAT' ? 'Cacat ' : 'Kurang ') + x.sisa + ' ' + esc(x.nama) + '</span> — <b style="color:' + (ok ? 'var(--ok)' : 'var(--bad)') + '">' + (ok ? 'Sudah diurgent (' + esc(x.po.join(', ')) + ')' + (x.qtyUrgent < x.sisa ? ' · baru ' + x.qtyUrgent : '') : 'Belum diganti') + '</b></div>';
  }).join('');
}
function gpoForm_() {
  var d = GP.d, p = d.penyesuaian, warna = p.status === 'BELUM_DILENGKAPI' ? 'var(--bad)' : 'var(--ok)';
  $('sh').innerHTML = '<div class="sheetx"><div class="mut" style="letter-spacing:.08em;font-weight:600">TERIMA PO DI GUDANG</div><div class="kp" style="margin-top:4px">' + esc(d.identitas) + (/URGENT/.test(d.kategori || '') ? ' <span class="tag" style="background:#c62828;color:#fff">URGENT</span>' : /PELENGKAP/.test(d.kategori || '') ? ' <span class="tag" style="background:#7b5bd6;color:#fff">PELENGKAP</span>' : '') + '</div>' +
    (d.reseller ? '<div class="mut">Reseller <b>' + esc(d.reseller) + '</b>' + (d.refAsal ? ' · No PO ' + esc(d.refAsal) : '') + '</div>' : '') +
    '<div class="mut">' + esc(d.mkl) + ' · ' + esc(d.jenis) + ' · ' + esc(d.nama) + ' (' + esc(d.tujuan) + ') · ' + d.pcs + ' pcs' + (d.deadline ? ' · deadline ' + esc(d.hariDeadline) + ' ' + esc(String(d.deadline).slice(5)) : '') + '</div>' +
    '<div class="kcbox" style="border:2px solid ' + warna + ';margin-top:10px"><b style="color:' + warna + ';font-size:16px">' + esc(p.label) + '</b>' +
      (p.status === 'BELUM_DILENGKAPI' ? '<div class="pv"><span class="k">' + p.sisa + ' pcs kurang/cacat belum diganti' + (d.kelompok === 'LUAR' ? ' (penjahit luar)' : '') + '. Lapor admin untuk PO Urgent.</span></div>' : '') +
      '<div class="pv">Update selesai: <b>' + esc(d.kelengkapan || '-') + '</b>' + (d.selesaiOleh ? ' oleh ' + esc(d.selesaiOleh) : '') + '</div>' + urgHtml_(d.urgent) + '</div>' +
    d.baris.map(function (b) {
      return '<div class="kcbox"><div style="word-break:break-word"><b>No ' + b.noJht + ' · ' + esc(b.nama) + '</b>' + (b.custom ? ' <span class="tag s">CUSTOM</span>' : '') + '</div><div class="mut" style="font-size:12px">' + esc(b.sku) + ' · pesanan <b>' + b.qty + '</b></div>' +
        '<div class="pv">' + (b.barang.map(function (x) { return '<b>' + x.qty + '</b> ' + esc(x.nama) + (GJ_[x.jenis] ? ' <span class="' + (x.jenis === 'CACAT' ? 'k' : '') + '">(' + GJ_[x.jenis] + ')</span>' : ''); }).join(' + ') || '<span class="k">Tidak ada barang</span>') + '</div>' +
        (b.ganti.length ? '<div class="pv">Barang penyesuaian: ' + b.ganti.map(function (x) { return '<b>' + x.qty + '</b> ' + esc(x.nama) + ' (ganti ' + esc(String(x.alasan || x.asal).toLowerCase()) + ')'; }).join(', ') + '</div>' : '') +
        (b.kurang.length ? '<div class="pv">Kurang saat update: ' + b.kurang.map(function (x) { return x.qty + ' ' + esc(x.nama); }).join(', ') + '</div>' : '') +
        '<div class="pv" style="font-weight:700;color:' + (b.sisa ? 'var(--bad)' : 'var(--ok)') + '">' + esc(b.kelengkapan) + '</div></div>';
    }).join('') +
    (d.keGudang.length ? '<div class="kcbox"><b>Masuk stok gudang</b> <span class="mut">(tidak ikut dibungkus)</span>' + d.keGudang.map(function (x) { return '<div class="pv"><b>' + x.qty + '</b> ' + esc(x.nama) + ' → ' + (x.jenis === 'DEFECT' ? '<span class="k">Defect</span>' : x.asal === 'SALAH' ? 'Stock (salah cutting)' : x.asal === 'GANTI_LEBIH' ? 'Stock (kelebihan penyesuaian)' : 'Stock (barang lebih)') + '</div>'; }).join('') + '<div class="mut" style="font-size:12px;margin-top:4px">Muncul di tab "Stock diloading" Web App Gudang.</div></div>' : '') +
    (d.bisa ? '<div class="row"><button class="btn" style="flex:1" onclick="last.t=Date.now();tutup()">Batal</button><button class="btn pri" style="flex:2" id="goG" onclick="gpoKirim_()">Terima di gudang</button></div>'
      : '<div class="kcbox"><span class="k">' + esc(d.pesan) + '</span></div><button class="btn pri" style="width:100%" onclick="last.t=Date.now();tutup()">Tutup</button>') + '</div>';
  $('ov').className = 'on';
}
function gpoKirim_() {
  var d = GP.d; $('goG').disabled = true;
  api('gterima', { token: ST.token, mkl: d.mkl, ref: GP.ref }).then(function (r) {
    last = { kc: d.mkl, t: Date.now() + 8000 }; // PO Gudang masih di depan kamera: jangan langsung terbaca lagi
    if (!r.ulang) GREC.unshift({ mkl: d.mkl, identitas: d.identitas, pcs: d.pcs, st: r.penyesuaian.status, label: r.penyesuaian.label, jam: new Date().toTimeString().slice(0, 5) }); GREC = GREC.slice(0, 8); rcG_();
    tampil(true, d.mkl + (r.ulang ? ' sudah tercatat.' : ' diterima gudang · ' + r.penyesuaian.label + (r.keGudang.length ? ' · ' + r.keGudang.length + ' baris ke tab Stock diloading' : '') + '.'));
  }).catch(function (e) { tampil(false, e.message); });
}
if (!window.__NOBOOT) boot();
</script></body></html>
